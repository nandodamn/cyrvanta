name: cyrvanta

services:
  postgres:
    image: postgres:16.6-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyrvanta}
      POSTGRES_USER: ${POSTGRES_USER:-cyrvanta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-cyrvanta_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-app-role.sh
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0.5-alpine
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cyrvanta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    profiles: [core]
    env_file: .env
    command: ["/bin/sh", "-c", "DATABASE_URL=$${DATABASE_ADMIN_URL} alembic upgrade head && uvicorn cyrvanta.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [internal, host-access]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  worker:
    build: ./backend
    profiles: [core]
    env_file: .env
    command: ["python", "-m", "cyrvanta.worker"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  scheduler:
    build: ./backend
    profiles: [core]
    env_file: .env
    command: ["python", "-m", "cyrvanta.scheduler"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    profiles: [core]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 15

  reverse-proxy:
    image: nginx:1.27.3-alpine
    profiles: [core]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [edge, internal]
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: [security, live-demo]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      compatibility.override_main_response_version: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [opensearch_data:/usr/share/opensearch/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    profiles: [security]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [internal]

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.6
    profiles: [security, live-demo]
    environment:
      INDEXER_URL: http://opensearch:9200
      FILEBEAT_SSL_VERIFICATION_MODE: none
    volumes: [wazuh_data:/var/ossec/data]
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [internal, host-access]
    ports:
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running'"]
      interval: 15s
      timeout: 8s
      retries: 30

  n8n:
    image: n8nio/n8n:1.123.65
    profiles: [automation, live-demo]
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow
        --input=/opt/cyrvanta/workflows/cyrvanta-demo-response.json
        && n8n update:workflow --id=cyrvanta-demo-response --active=true
        && exec n8n start
    environment:
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_SQLITE_POOL_SIZE: "2"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infrastructure/n8n/cyrvanta-demo-response.json:/opt/cyrvanta/workflows/cyrvanta-demo-response.json:ro
    ports: ["127.0.0.1:5678:5678"]
    networks: [internal, host-access]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:
  wazuh_data:
  n8n_data:

networks:
  edge:
  host-access:
  internal:
    internal: true

configs:
  postgres_init:
    file: ./infrastructure/postgres/01-app-role.sh
