[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cyrvanta-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.4,<10",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ldap3>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyrvanta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/cyrvanta/modules/identity/presentation/router.py" = ["B008"]
"src/cyrvanta/shared/dependencies.py" = ["B008"]
"src/cyrvanta/modules/identity/application/schemas.py" = ["S105"]
"tests/unit/test_directory.py" = ["S106"]
"tests/unit/test_simulated_directory.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["cyrvanta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
