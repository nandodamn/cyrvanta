# Cyrvanta lab agent syslog configuration.
#
# The distribution default reads local messages through imjournal, which needs
# systemd-journald. This container has no systemd, so nothing created /dev/log
# and every authentication message was discarded before reaching disk.
#
# imuxsock with the system socket enabled restores the plain Unix socket, and
# the traditional file format is what produces the "Mon DD HH:MM:SS host
# sshd[pid]:" prefix that the Wazuh sshd decoders match on.
module(load="imuxsock" SysSock.Use="on")
module(load="builtin:omfile" Template="RSYSLOG_TraditionalFileFormat")

*.info;mail.none;authpriv.none;cron.none    /var/log/messages
authpriv.*                                  /var/log/secure
