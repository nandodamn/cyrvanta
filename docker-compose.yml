name: cyrvanta

services:
  postgres:
    image: postgres:16.6-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyrvanta}
      POSTGRES_USER: ${POSTGRES_USER:-cyrvanta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-cyrvanta_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-app-role.sh
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0.5-alpine
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cyrvanta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    profiles: [core]
    env_file: .env
    command: ["/bin/sh", "-c", "DATABASE_URL=$${DATABASE_ADMIN_URL} alembic upgrade head && uvicorn cyrvanta.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [internal, host-access]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    profiles: [core]
    env_file: .env
    command: ["python", "-m", "cyrvanta.worker"]
    # Reads /proc directly: the image ships no procps, so a pgrep-based check
    # fails for want of the binary and reports a perfectly healthy worker as
    # unhealthy. `grep -a` because a cmdline is NUL-separated. This confirms
    # PID 1 is the expected module, which catches a container started on the
    # wrong command or left on a stale image; it does not prove the loop is
    # still making progress. That needs a heartbeat the process updates.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa cyrvanta.worker /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend: { condition: service_healthy }
    # host-access as well as internal: the worker redacts threat explanations
    # through Ollama, which runs on the host. It declared the host-gateway
    # alias but sat only on the internal network, which has no route off the
    # bridge -- so the name resolved, the connection failed, and every
    # explanation quietly fell back to the deterministic text. Silently, since
    # falling back is the correct behaviour when the model is unreachable.
    networks: [internal, host-access]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  scheduler:
    build: {context: ., dockerfile: backend/Dockerfile}
    profiles: [core]
    env_file: .env
    command: ["python", "-m", "cyrvanta.scheduler"]
    # Reads /proc directly: the image ships no procps, so a pgrep-based check
    # fails for want of the binary and reports a perfectly healthy worker as
    # unhealthy. `grep -a` because a cmdline is NUL-separated. This confirms
    # PID 1 is the expected module, which catches a container started on the
    # wrong command or left on a stale image; it does not prove the loop is
    # still making progress. That needs a heartbeat the process updates.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa cyrvanta.scheduler /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend: { condition: service_healthy }
    # Same reason as the worker: the scheduler drafts memory suggestions
    # through Ollama on the host.
    networks: [internal, host-access]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    profiles: [core]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 15

  reverse-proxy:
    image: nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
    profiles: [core]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [edge, internal]
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: [security, live-demo]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      compatibility.override_main_response_version: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [opensearch_data:/usr/share/opensearch/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    profiles: [security]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [internal]

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.6
    profiles: [security, live-demo]
    environment:
      INDEXER_URL: http://opensearch:9200
      FILEBEAT_SSL_VERIFICATION_MODE: none
    volumes:
      - wazuh_data:/var/ossec/data
      - ./infrastructure/wazuh/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # Silences events with no security meaning at the manager, before they
      # reach the indexer or become findings.
      - ./infrastructure/wazuh/manager/rules/cyrvanta_noise_filter.xml:/wazuh-config-mount/etc/rules/cyrvanta_noise_filter.xml:ro
      - ./infrastructure/wazuh/manager/certs/server.crt:/wazuh-config-mount/api/configuration/ssl/server.crt:ro
      - ./infrastructure/wazuh/manager/certs/server.key:/wazuh-config-mount/api/configuration/ssl/server.key:ro
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [internal, host-access]
    ports:
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running'"]
      interval: 15s
      timeout: 8s
      retries: 30

  n8n:
    image: n8nio/n8n:1.123.65
    profiles: [automation, live-demo]
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command:
      # Imports whatever the manifest ships and activates nothing. Activation is
      # an operational decision made against a reviewed digest -- see
      # infrastructure/n8n/scripts/reconcile.py -- not something a container
      # start-up does on its own. The glob tolerates an empty directory, which
      # is the shipped state.
      - >-
        for workflow in /opt/cyrvanta/n8n/workflows/*.json;
        do [ -e "$$workflow" ] || break;
        n8n import:workflow --input="$$workflow" || exit 1; done
        && exec n8n start
    environment:
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_SQLITE_POOL_SIZE: "2"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infrastructure/n8n:/opt/cyrvanta/n8n:ro
    ports: ["127.0.0.1:5678:5678"]
    networks: [internal, host-access]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20

  lab-workstation-01:
    build: ./infrastructure/wazuh/agent
    profiles: [security, live-demo]
    hostname: lab-workstation-01
    environment:
      WAZUH_MANAGER_SERVER: wazuh-manager
      WAZUH_AGENT_NAME: lab-workstation-01
      WAZUH_AGENT_GROUP: default
    cap_add: [NET_ADMIN]
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      wazuh-manager: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped

  lab-server-01:
    build: ./infrastructure/wazuh/agent
    profiles: [security, live-demo]
    hostname: lab-server-01
    environment:
      WAZUH_MANAGER_SERVER: wazuh-manager
      WAZUH_AGENT_NAME: lab-server-01
      WAZUH_AGENT_GROUP: default
      # Target of the credential-attack scenario: real logins, real source IPs.
      LAB_SSH_ENABLED: "1"
      LAB_SSH_USER: analista
      # Shared with demo-console via the same .env value, so the console can
      # render a working login command without reaching into this container.
      LAB_SSH_PASSWORD: ${LAB_SSH_PASSWORD:?Set LAB_SSH_PASSWORD}
      # Lets the scenario continue past the login into privilege escalation,
      # which is what the privilege-escalation correlation rule detects.
      LAB_SUDO_ENABLED: "1"
    cap_add: [NET_ADMIN]
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      wazuh-manager: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped

  ldap:
    image: osixia/openldap:1.5.0
    profiles: [security, live-demo]
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Cyrvanta Lab"
      LDAP_DOMAIN: cyrvanta-lab.local
      LDAP_ADMIN_PASSWORD: local-dev-only-ldap-admin-3f9a
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ldap.crt
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./infrastructure/ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - ./infrastructure/ldap/certs:/container/service/slapd/assets/certs:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldapi:///", "-b", "dc=cyrvanta-lab,dc=local", "-D", "cn=admin,dc=cyrvanta-lab,dc=local", "-w", "local-dev-only-ldap-admin-3f9a"]
      interval: 15s
      timeout: 8s
      retries: 20
    restart: unless-stopped

  # Lab stand-ins for the third-party systems a tenant configures. They make an
  # end-to-end run perform a real delivery inside the lab network instead of
  # depending on an internet service. Both are lab-only: never a demo of a
  # genuine threat intelligence assessment.
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: [live-demo]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    # Only the inbox is published, and only to the loopback interface; SMTP
    # itself stays inside the internal network like every other dependency.
    # host-access is what makes a published port reachable, since `internal` is
    # declared internal-only.
    ports: ["127.0.0.1:8025:8025"]
    networks: [internal, host-access]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Guided walkthrough for the end-to-end scenarios. Lives outside the product
  # on purpose: it never ships with a Cyrvanta deployment, and it observes
  # rather than acts -- no command execution, no docker socket, read-only
  # queries and a TCP connect.
  demo-console:
    build: {context: ., dockerfile: backend/Dockerfile}
    profiles: [live-demo]
    env_file: .env
    command: ["python", "/srv/server.py"]
    volumes:
      - ./infrastructure/demo-console/server.py:/srv/server.py:ro
    environment:
      DEMO_CONSOLE_PORT: "8090"
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-}
      DEMO_TARGET_HOST: lab-server-01
      DEMO_TARGET_PORT: "22"
      DEMO_SSH_USER: analista
      # env_file already loads LAB_SSH_PASSWORD from .env; declared here too so
      # it is visible next to what actually uses it.
      LAB_SSH_PASSWORD: ${LAB_SSH_PASSWORD:?Set LAB_SSH_PASSWORD}
    ports: ["127.0.0.1:8090:8090"]
    networks: [internal, host-access]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  lab-endpoint:
    image: python:3.12-alpine
    profiles: [live-demo]
    command: ["python", "/srv/server.py"]
    volumes:
      - ./infrastructure/lab-endpoint/server.py:/srv/server.py:ro
    environment:
      LAB_ENDPOINT_PORT: "8081"
    networks: [internal]
    mem_limit: 128m
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:
  wazuh_data:
  n8n_data:
  ldap_data:
  ldap_config:

networks:
  edge:
  host-access:
  internal:
    internal: true

configs:
  postgres_init:
    file: ./infrastructure/postgres/01-app-role.sh
