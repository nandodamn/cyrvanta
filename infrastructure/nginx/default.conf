limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  # Resolve Compose service names for every request window so recreating an
  # upstream container does not leave nginx pinned to its previous IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;
  set $frontend_upstream http://frontend:8080;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location ^~ /api/v1/internal/ {
    return 404;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_read_timeout 130s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass $backend_upstream;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass $frontend_upstream;
  }
}
